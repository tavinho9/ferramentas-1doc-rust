name: Instalador Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]     # Release criada pela página do GitHub (tag vX.Y.Z): o instalador é anexado sozinho
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes
        run: cargo test

  windows:
    name: Testes e instalador (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Testes (inclui login com Chrome real e a janela)
        env:
          AUTOTESTE_NAVEGADOR_REAL: "1"
        run: cargo test

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "versao=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar (release)
        run: cargo build --release

      - name: Executáveis sem o runtime do Visual C++ (crt-static)
        shell: pwsh
        run: |
          # .cargo/config.toml embute o runtime; o .exe não pode importar vcruntime140.dll, msvcp, ucrtbase ou api-ms-win-crt-*
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe não encontrado"; exit 1 }
          foreach ($exe in @('Ferramentas1Doc.exe')) {
            $saida = & $dumpbin.FullName /nologo /dependents "target\release\$exe"
            if ($LASTEXITCODE -ne 0) { $saida; Write-Error "dumpbin falhou em $exe"; exit 1 }
            $dlls = @($saida | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() })
            Write-Host "$exe importa: $($dlls -join ', ')"
            if (-not ($dlls -contains 'KERNEL32.dll')) { $saida; Write-Error "lista de DLLs de $exe não reconhecida"; exit 1 }
            $runtime = @($dlls | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' })
            if ($runtime.Count -gt 0) { Write-Error "$exe ainda depende de: $($runtime -join ', ')"; exit 1 }
          }

      - name: Autoteste do executável
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target\release\Ferramentas1Doc.exe" `
               -ArgumentList '--autoteste','--relatorio','autoteste-pacote.txt' -Wait -PassThru
          Get-Content autoteste-pacote.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Compilar o instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.versao.outputs.versao }}" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Instalar, testar o instalado e desinstalar
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Ferramentas1Doc-Rust-Setup-*.exe | Select-Object -First 1
          $pasta = "$env:LOCALAPPDATA\Programs\Ferramentas 1Doc Rust"
          $exe = "$pasta\Ferramentas1Doc.exe"
          # como numa atualização da 1.0.0, que instalava a linha de comando: o instalador tem de apagá-la
          New-Item -ItemType Directory -Force $pasta | Out-Null
          Set-Content "$pasta\ferramentas1doc-cli.exe" 'versão anterior'
          $p = Start-Process $setup.FullName -Wait -PassThru `
               -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/LOG=instalacao.log'
          if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { Get-Content instalacao.log; exit 1 }
          if (Test-Path "$pasta\ferramentas1doc-cli.exe") { Write-Error "a linha de comando de versões anteriores ficou na pasta"; exit 1 }
          $atalho = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ferramentas 1Doc (Rust).lnk"
          if (-not (Test-Path $atalho)) { Write-Error "atalho do menu Iniciar não criado"; exit 1 }
          $p = Start-Process $exe -ArgumentList '--autoteste','--relatorio','autoteste-instalado.txt' -Wait -PassThru
          Get-Content autoteste-instalado.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Start-Process "$pasta\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { Write-Error "a desinstalação deixou o executável"; exit 1 }
          Write-Host "Instalação, autoteste e desinstalação OK"

      - uses: actions/upload-artifact@v4
        with:
          name: Ferramentas1Doc-Rust-Setup-${{ steps.versao.outputs.versao }}
          path: dist/Ferramentas1Doc-Rust-Setup-*.exe
          if-no-files-found: error

      - name: Anexar o instalador à Release (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # idempotente: se a Release já existe (criada à mão ou por execução anterior), só troca o instalador
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Ferramentas1Doc-Rust-Setup-*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Ferramentas1Doc-Rust-Setup-*.exe \
              --title "Ferramentas 1Doc (Rust) ${GITHUB_REF_NAME#v}" --notes-file NOTAS_DA_VERSAO.md
          fi
