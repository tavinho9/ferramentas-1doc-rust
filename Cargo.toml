[package]
name = "ferramentas1doc"
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
description = "Ferramentas 1Doc — Prefeitura de Montes Claros (versão Rust)"
publish = false
default-run = "Ferramentas1Doc"

[lib]
name = "ferramentas1doc"
path = "src/lib.rs"

[[bin]]
name = "Ferramentas1Doc"
path = "src/main.rs"

[[bin]]
name = "ferramentas1doc-cli"
path = "src/bin/ferramentas1doc-cli.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
csv = "1.3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11", "accesskit"] }
ego-tree = "0.11"
egui = "0.37"
egui-wgpu = "0.37"
encoding_rs = "0.8"
fancy-regex = "0.20"
opener = "0.9"
pollster = "0.4"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies", "charset", "system-proxy", "rustls-no-provider", "form", "query"] }
rfd = "0.18"
rust_xlsxwriter = { version = "0.102", features = ["chrono"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1.3"
tempfile = "3.15"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
umya-spreadsheet = "3.1"
unicode-normalization = "0.1"
url = "2.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = "0.37"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
